name: ros2-test-sub-humble
version: '0.1'
summary: ROS 2 Humble test subscribers (simple + pointcloud)
description: |
  Two ROS 2 nodes built from a standard colcon workspace at src/:

  - test_sub_simple (Python, ament_python): subscribes to /test/string,
    /test/int32, and /test/twist and logs each message.
  - test_sub_pointcloud (C++, ament_cmake): subscribes to the
    2048x2048 /test/pointcloud and logs metadata of every 10th
    message. QoS must match the publisher (best-effort + depth 1).

  Needs the ros-humble-ros-base content snap connected at runtime. Run
  as the same user as ros2-test-pub-humble.

base: core22
confinement: devmode
grade: devel

apps:
  simple:
    extensions: [ros2-humble-ros-base]
    command: opt/ros/snap/lib/test_sub_simple/sub_simple
    plugs: [network, network-bind]
    environment:
      FASTRTPS_DEFAULT_PROFILES_FILE: $SNAP/usr/share/fastdds_no_shared_memory.xml
  pointcloud:
    extensions: [ros2-humble-ros-base]
    command: opt/ros/snap/lib/test_sub_pointcloud/pointcloud_subscriber
    plugs: [network, network-bind]
    environment:
      FASTRTPS_DEFAULT_PROFILES_FILE: $SNAP/usr/share/fastdds_no_shared_memory.xml

parts:
  workspace:
    plugin: colcon
    source: src
    colcon-packages:
      - test_sub_simple
      - test_sub_pointcloud
  fastdds-profile:
    plugin: nil
    override-build: |
      install -Dm644 "$CRAFT_PROJECT_DIR/fastdds_no_shared_memory.xml" \
        "$CRAFT_PART_INSTALL/usr/share/fastdds_no_shared_memory.xml"
