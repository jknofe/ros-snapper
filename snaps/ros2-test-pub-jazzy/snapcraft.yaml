name: ros2-test-pub-jazzy
version: '0.1'
summary: ROS 2 Jazzy test publishers (simple + pointcloud)
description: |
  Two ROS 2 nodes built from a standard colcon workspace at src/:

  - test_pub_simple (Python, ament_python): publishes /test/string,
    /test/int32, and /test/twist at 1 Hz.
  - test_pub_pointcloud (C++, ament_cmake): publishes a 2048x2048
    sensor_msgs/PointCloud2 on /test/pointcloud at 10 Hz with
    best-effort QoS.

  Needs the ros-jazzy-ros-base content snap connected at runtime. Run
  as the same user as ros2-test-sub-jazzy.

base: core24
confinement: devmode
grade: devel

apps:
  simple:
    extensions: [ros2-jazzy-ros-base]
    command: opt/ros/snap/lib/test_pub_simple/pub_simple
    plugs: [network, network-bind]
    environment:
      FASTRTPS_DEFAULT_PROFILES_FILE: $SNAP/usr/share/fastdds_no_shared_memory.xml
  pointcloud:
    extensions: [ros2-jazzy-ros-base]
    command: opt/ros/snap/lib/test_pub_pointcloud/pointcloud_publisher
    plugs: [network, network-bind]
    environment:
      FASTRTPS_DEFAULT_PROFILES_FILE: $SNAP/usr/share/fastdds_no_shared_memory.xml

parts:
  workspace:
    plugin: colcon
    source: src
    colcon-packages:
      - test_pub_simple
      - test_pub_pointcloud
  fastdds-profile:
    plugin: nil
    override-build: |
      install -Dm644 "$CRAFT_PROJECT_DIR/fastdds_no_shared_memory.xml" \
        "$CRAFT_PART_INSTALL/usr/share/fastdds_no_shared_memory.xml"
