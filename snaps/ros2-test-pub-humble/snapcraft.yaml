name: ros2-test-pub-humble
version: '0.1'
summary: ROS 2 Humble test publisher snap
description: |
  Test publisher for ros2-test-sub-humble / ros2-cli. Publishes /test/string,
  /test/int32, and /test/twist at 1 Hz, plus a 2048x2048 sensor_msgs/PointCloud2
  on /test/pointcloud at 10 Hz (best-effort QoS). Needs the ros-humble-ros-base
  content snap connected. Run as the same user as the subscriber.

base: core22
confinement: devmode
grade: devel

apps:
  pub:
    command: bin/launch.sh
    plugs:
      - network
      - network-bind

plugs:
  ros-humble-ros-base:
    content: ros-humble-ros-base
    interface: content
    target: $SNAP/opt/ros/underlay_ws
    default-provider: ros-humble-ros-base

parts:
  publisher:
    plugin: nil
    stage-packages:
      - python3
      - python3-minimal
      - python3-numpy
    override-build: |
      craftctl default
      install -Dm755 "$CRAFT_PROJECT_DIR/launch.sh" "$CRAFT_PART_INSTALL/bin/launch.sh"
      install -Dm644 "$CRAFT_PROJECT_DIR/pub.py"    "$CRAFT_PART_INSTALL/usr/share/pub.py"
      cat > "$CRAFT_PART_INSTALL/usr/share/fastdds_no_shared_memory.xml" << 'XMLEOF'
      <?xml version="1.0" encoding="UTF-8" ?>
          <profiles xmlns="http://www.eprosima.com/XMLSchemas/fastRTPS_Profiles" >
          <transport_descriptors>
              <transport_descriptor>
                  <transport_id>CustomUdpTransport</transport_id>
                  <type>UDPv4</type>
              </transport_descriptor>
          </transport_descriptors>
          <participant profile_name="participant_profile" is_default_profile="true">
              <rtps>
                  <userTransports>
                      <transport_id>CustomUdpTransport</transport_id>
                  </userTransports>
                  <useBuiltinTransports>false</useBuiltinTransports>
              </rtps>
          </participant>
      </profiles>
      XMLEOF
