name: ros2-test-sub-jazzy
version: '0.1'
summary: ROS 2 Jazzy test subscriber snap
description: |
  Test subscriber for ros2-test-pub-jazzy. Subscribes to /test/string,
  /test/int32, /test/twist, and a 2048x2048 sensor_msgs/PointCloud2 on
  /test/pointcloud, and logs each message it receives (pointcloud is
  logged once per ~10 messages). Needs the ros-jazzy-ros-base content
  snap connected. Run as the same user as the publisher.

base: core24
confinement: devmode
grade: devel

apps:
  sub:
    command: bin/launch.sh
    plugs:
      - network
      - network-bind

plugs:
  ros-jazzy-ros-base:
    content: ros-jazzy-ros-base
    interface: content
    target: $SNAP/opt/ros/underlay_ws
    default-provider: ros-jazzy-ros-base

parts:
  subscriber:
    plugin: nil
    stage-packages:
      - python3
      - python3-minimal
    override-build: |
      craftctl default
      install -Dm755 "$CRAFT_PROJECT_DIR/launch.sh" "$CRAFT_PART_INSTALL/bin/launch.sh"
      install -Dm644 "$CRAFT_PROJECT_DIR/sub.py"    "$CRAFT_PART_INSTALL/usr/share/sub.py"
      cat > "$CRAFT_PART_INSTALL/usr/share/fastdds_no_shared_memory.xml" << 'XMLEOF'
      <?xml version="1.0" encoding="UTF-8" ?>
          <profiles xmlns="http://www.eprosima.com/XMLSchemas/fastRTPS_Profiles" >
          <transport_descriptors>
              <transport_descriptor>
                  <transport_id>CustomUdpTransport</transport_id>
                  <type>UDPv4</type>
              </transport_descriptor>
          </transport_descriptors>
          <participant profile_name="participant_profile" is_default_profile="true">
              <rtps>
                  <userTransports>
                      <transport_id>CustomUdpTransport</transport_id>
                  </userTransports>
                  <useBuiltinTransports>false</useBuiltinTransports>
              </rtps>
          </participant>
      </profiles>
      XMLEOF
