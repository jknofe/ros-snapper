name: ros2-test-sub-rolling
version: '0.1'
summary: ROS 2 Rolling test subscriber snap
description: |
  Test subscriber for ros2-test-pub-rolling. Subscribes to /test/string,
  /test/int32, and /test/twist and logs each message it receives. Needs
  the ros-rolling-ros-base content snap connected. Run as the same user
  as the publisher.

base: core24
confinement: devmode
grade: devel

apps:
  sub:
    command: bin/launch.sh
    plugs:
      - network
      - network-bind

plugs:
  ros-rolling-ros-base:
    content: ros-rolling-ros-base
    interface: content
    target: $SNAP/opt/ros/underlay_ws
    default-provider: ros-rolling-ros-base

parts:
  subscriber:
    plugin: nil
    stage-packages:
      - python3
      - python3-minimal
    override-build: |
      craftctl default
      install -Dm755 "$CRAFT_PROJECT_DIR/launch.sh" "$CRAFT_PART_INSTALL/bin/launch.sh"
      install -Dm644 "$CRAFT_PROJECT_DIR/sub.py"    "$CRAFT_PART_INSTALL/usr/share/sub.py"
      cat > "$CRAFT_PART_INSTALL/usr/share/fastdds_no_shared_memory.xml" << 'XMLEOF'
      <?xml version="1.0" encoding="UTF-8" ?>
          <profiles xmlns="http://www.eprosima.com/XMLSchemas/fastRTPS_Profiles" >
          <transport_descriptors>
              <transport_descriptor>
                  <transport_id>CustomUdpTransport</transport_id>
                  <type>UDPv4</type>
              </transport_descriptor>
          </transport_descriptors>
          <participant profile_name="participant_profile" is_default_profile="true">
              <rtps>
                  <userTransports>
                      <transport_id>CustomUdpTransport</transport_id>
                  </userTransports>
                  <useBuiltinTransports>false</useBuiltinTransports>
              </rtps>
          </participant>
      </profiles>
      XMLEOF
